name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

# A newer push to the same branch supersedes an older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # macOS 15 is the package's floor; macOS 26 is what the app ships on.
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    # A nesting or table regression hangs rather than fails, so don't wait the 6-hour default.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # swift-tools 6.2 needs Xcode 26, which isn't the default on the macOS 15 image.
      - name: Use Xcode 26
        run: |
          set -euo pipefail
          app=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Selecting $app"
          sudo xcode-select -s "$app"
      - run: swift --version
      - run: swift build
      # TEMPORARY diagnostics for PR #22; removed before merge.
      - name: "Diagnostics: CLI export with math (nested parsing), debug and release"
        continue-on-error: true
        run: |
          set -uo pipefail
          d=$(mktemp -d)
          printf '# Math\n\nInline $a^2 + b^2 = c^2$ and $x_1$.\n\n$$\n\\sum_{i=1}^{n} i = \\frac{n(n+1)}{2}\n$$\n\n> quoted $y$\n' > "$d/math.md"
          cat "$d/math.md"
          for config in debug release; do
            swift build -c $config --product marsdawn > /dev/null
            "$(swift build -c $config --show-bin-path)/marsdawn" export "$d/math.md" -o "$d/math-$config.pdf" --json; echo "$config math exit=$?"
          done
      - name: "Diagnostics: standalone repro of the nested-calls test pattern, under lldb"
        continue-on-error: true
        run: |
          cat > /tmp/repro.swift <<'SWIFT'
          import Foundation
          import Synchronization
          setvbuf(stdout, nil, _IONBF, 0)
          for round in 0..<200 {
              let finished = DispatchSemaphore(value: 0)
              let inner = Mutex<(Bool, String)?>(nil)
              Thread.detachNewThread {
                  inner.withLock { $0 = (true, "x") }
                  finished.signal()
              }
              _ = finished.wait(timeout: .now() + 10)
              let value = inner.withLock { $0 }
              if round % 50 == 0 { print("round", round, value as Any) }
          }
          print("repro done")
          SWIFT
          swiftc -Onone /tmp/repro.swift -o /tmp/repro && lldb --batch -o run -k "bt 25" -k "quit 1" /tmp/repro; echo "lldb exit=$?"
      - name: "Diagnostics: crash reports so far"
        if: always()
        continue-on-error: true
        run: |
          sleep 20
          find ~/Library/Logs/DiagnosticReports /Library/Logs/DiagnosticReports -name '*.ips' -mmin -30 2>/dev/null | while read -r f; do echo "== $f"; head -c 12000 "$f"; echo; done
      # Release builds inline more, so stack use per nesting level differs from debug.
      - run: swift test -c release

  ios:
    # The core library still supports iOS 17; make sure it keeps building for it.
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pick Xcode 26 here too, so this job doesn't drift if the runner's default changes.
      - name: Use Xcode 26
        run: |
          set -euo pipefail
          app=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Selecting $app"
          sudo xcode-select -s "$app"
      - run: xcodebuild -version
      - run: xcodebuild -scheme MarsDawnKit -destination 'generic/platform=iOS' build
