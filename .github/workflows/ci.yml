name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

# A newer push to the same branch supersedes an older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # macOS 15 is the package's floor; macOS 26 is what the app ships on.
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    # A nesting or table regression hangs rather than fails, so don't wait the 6-hour default.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # swift-tools 6.2 needs Xcode 26, which isn't the default on the macOS 15 image.
      - name: Use Xcode 26
        run: |
          set -euo pipefail
          app=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Selecting $app"
          sudo xcode-select -s "$app"
      - run: swift --version
      - run: swift build
      # TEMPORARY diagnostics for PR #22; removed before merge.
      - name: "Diagnostics: zh-Hant matching in the built bundle"
        continue-on-error: true
        run: |
          set -euo pipefail
          b=$(find .build -type d -name 'MarsDawnKit_MarsDawnKit.bundle' | head -1); echo "$b"; find "$b" -name '*.lproj'
          cat > /tmp/m.swift <<'SWIFT'
          import Foundation
          let b = Bundle(path: CommandLine.arguments[1])!
          for prefs in [["zh-Hant"], ["zh-Hant-TW"], ["zh-TW"]] {
              let match = Bundle.preferredLocalizations(from: b.localizations, forPreferences: prefs)
              let file = match.first.flatMap { b.path(forResource: "Localizable", ofType: "strings", inDirectory: nil, forLocalization: $0) }
              print(prefs, "->", match, file.flatMap { NSDictionary(contentsOfFile: $0)?["Image not available"] as? String } ?? "NO STRING")
          }
          SWIFT
          swift /tmp/m.swift "$b"
      - name: "Diagnostics: CLI export of trap-suspect front matter and deep nesting"
        continue-on-error: true
        run: |
          set -uo pipefail
          d=$(mktemp -d)
          printf -- '---\na\xd8\x80: x\n\xe2\x80\x8da: x\na: \xcc\x81v\na: v \xcc\x81\n\xc3\xa9t\xc3\xa9: x\nab\xe2\x80\x8dc: x\n---\n# Body\n' > "$d/fm.md"
          od -c "$d/fm.md" | head -5
          SWIFT_BACKTRACE=enable=yes,interactive=no swift run marsdawn export "$d/fm.md" --json; echo "exit=$?"
          python3 -c "print('> ' * 250 + 'deep')" > "$d/deep.md"
          SWIFT_BACKTRACE=enable=yes,interactive=no swift run marsdawn export "$d/deep.md" --json; echo "exit=$?"
      - name: "Diagnostics: FrontMatterTests alone, with backtraces"
        continue-on-error: true
        env:
          SWIFT_BACKTRACE: enable=yes,interactive=no,symbolicate=full
        run: swift test --skip-build --no-parallel --filter 'FrontMatterTests' 2>&1 | tail -150
      - name: "Diagnostics: crash reports so far"
        if: always()
        continue-on-error: true
        run: |
          sleep 20
          find ~/Library/Logs/DiagnosticReports /Library/Logs/DiagnosticReports -name '*.ips' -mmin -30 2>/dev/null | while read -r f; do echo "== $f"; head -c 12000 "$f"; echo; done
      - name: "Diagnostics: full run, not parallel"
        run: time swift test --no-parallel
      - name: "Diagnostics: crash reports"
        if: failure()
        run: |
          ls -t ~/Library/Logs/DiagnosticReports/ | head
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -2); do echo "== $f"; head -c 8000 "$f"; echo; done
      # Release builds inline more, so stack use per nesting level differs from debug.
      - run: swift test -c release

  ios:
    # The core library still supports iOS 17; make sure it keeps building for it.
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pick Xcode 26 here too, so this job doesn't drift if the runner's default changes.
      - name: Use Xcode 26
        run: |
          set -euo pipefail
          app=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Selecting $app"
          sudo xcode-select -s "$app"
      - run: xcodebuild -version
      - run: xcodebuild -scheme MarsDawnKit -destination 'generic/platform=iOS' build
