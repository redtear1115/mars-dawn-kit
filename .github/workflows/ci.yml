name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

# A newer push to the same branch supersedes an older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # macOS 15 is the package's floor; macOS 26 is what the app ships on.
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    # A nesting or table regression hangs rather than fails, so don't wait the 6-hour default.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # swift-tools 6.2 needs Xcode 26, which isn't the default on the macOS 15 image.
      - name: Use Xcode 26
        run: |
          set -euo pipefail
          app=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Selecting $app"
          sudo xcode-select -s "$app"
      - run: swift --version
      - run: swift build
      # TEMPORARY diagnostics for PR #22; removed before merge.
      - name: "Diagnostics: the CLI's zh-Hant labels"
        continue-on-error: true
        run: |
          set -euo pipefail
          sysctl -n hw.ncpu hw.memsize
          find .build -path '*MarsDawnKit_MarsDawnKit.bundle*' -name '*.lproj'
          d=$(mktemp -d); printf '# L10N\n\n![x](missing.png)\n' > "$d/doc.md"
          defaults write marsdawn AppleLanguages '(zh-Hant)'
          swift run marsdawn export "$d/doc.md" --json
          defaults delete marsdawn AppleLanguages
          printf 'import PDFKit\nlet d = PDFDocument(url: URL(fileURLWithPath: CommandLine.arguments[1]))!\nprint((0..<d.pageCount).map { d.page(at: $0)?.string ?? "" }.joined())\n' > "$d/x.swift"
          swift "$d/x.swift" "$d/doc.pdf"
      - name: "Diagnostics: full run, not parallel"
        run: time swift test --no-parallel
      - name: "Diagnostics: crash reports"
        if: failure()
        run: |
          ls -t ~/Library/Logs/DiagnosticReports/ | head
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -2); do echo "== $f"; head -c 8000 "$f"; echo; done
      # Release builds inline more, so stack use per nesting level differs from debug.
      - run: swift test -c release

  ios:
    # The core library still supports iOS 17; make sure it keeps building for it.
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pick Xcode 26 here too, so this job doesn't drift if the runner's default changes.
      - name: Use Xcode 26
        run: |
          set -euo pipefail
          app=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Selecting $app"
          sudo xcode-select -s "$app"
      - run: xcodebuild -version
      - run: xcodebuild -scheme MarsDawnKit -destination 'generic/platform=iOS' build
