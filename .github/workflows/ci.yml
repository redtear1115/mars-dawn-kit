name: CI

on:
  push:
    branches: [main]
    # Releases are tagged with a bare version, no `v` (see RELEASING.md). Building the tag runs
    # the whole suite against exactly the tree that was tagged, which is the one moment it is
    # worth doing twice, and it is the only way `version-matches-tag` below can run at all.
    tags: ['*.*.*']
  pull_request:

permissions: {}

# A newer push to the same branch supersedes an older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # macOS 15 is the package's floor; macOS 26 is what the app ships on.
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15]  # EXPERIMENT (#26): macOS 15 only; revert before merge
    runs-on: ${{ matrix.runner }}
    # A nesting or table regression hangs rather than fails, so don't wait the 6-hour default.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # swift-tools 6.2 needs Xcode 26, which isn't the default on the macOS 15 image.
      - name: Use Xcode 26
        run: |
          set -euo pipefail
          app=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Selecting $app"
          sudo xcode-select -s "$app"
      - run: swift --version
      - run: swift build
      # Not in parallel: the hosted runners have 3 CPUs, and with every suite running at once the
      # WebKit suites time out waiting for their pages and the timing-budget tests miss their
      # budgets. Run alone they pass (checked on both runners in #22), and so does the whole
      # suite run serially.
      # EXPERIMENT (#26), revert before merge: which gate test leaves the process in a state where
      # ScopedFileReaderTests.refusesAFIFOWithoutHanging traps later? Each run is its own process.
      - name: Bisect the macOS 15 trap
        run: |
          set +e
          report() {
            echo "START ORDER $1: $(grep -o 'Test [a-zA-Z]*() started' "/tmp/$1.log" | sed 's/Test //; s/() started//' | tr '\n' ' ')"
            echo "::group::$1: log tail"
            tail -25 "/tmp/$1.log"
            echo "::endgroup::"
            echo "RESULT $1: exit $2 | $(grep -E 'Test run with|unexpected signal' /tmp/$1.log | tail -1)"
            sleep 5  # the crash report is written a moment after the crash
            for f in ~/Library/Logs/DiagnosticReports/*.ips; do
              [ -e "$f" ] || continue
              echo "::group::$1 crash report $(basename "$f")"
              python3 - "$f" <<'PYX'
          import json,sys
          text=open(sys.argv[1]).read().split("\n",1)
          body=json.loads(text[1]) if len(text)>1 else {}
          print("exception:", body.get("exception"), "| termination:", body.get("termination",{}).get("indicator"))
          frames=body.get("threads",[])
          images=body.get("usedImages",[])
          for t in frames:
              if not t.get("triggered"): continue
              print("triggered thread:", t.get("name"), t.get("queue"))
              for fr in t.get("frames",[])[:40]:
                  img=images[fr.get("imageIndex",0)].get("name","?") if images else "?"
                  print("  ", img, fr.get("symbol","?"), "+", fr.get("symbolLocation",""))
          PYX
              echo "::endgroup::"
              rm -f "$f"
            done
          }
          run() { name=$1; shift; swift test --no-parallel --filter "$1" > "/tmp/$name.log" 2>&1; report "$name" $?; }
          rm -f ~/Library/Logs/DiagnosticReports/*.ips
          run E0-fifo-alone 'refusesAFIFOWithoutHanging'
          run X5-top-level 'x5EmptyThreadFromATopLevelHelper'
          run X1-empty 'x1EmptyThread'
          run X2-clock 'x2ThreadReadsTheClock'
          run X3-instance-helper 'x3ThreadCallsAnInstanceHelper'
          run X4-static-fifo 'x4ThreadDoesTheFIFOReadThroughAStatic'
          bin="$(swift build --show-bin-path)/MarsDawnKitPackageTests.xctest/Contents/MacOS/MarsDawnKitPackageTests"
          nm -j "$bin" | grep -E 'refusesAFIFOWithoutHanging|topLevelOnThread|onThread|startThread' | grep -v TestfMp_ | while read -r sym; do
            name=$(echo "$sym" | xcrun swift-demangle --simplified)
            echo "SYMBOL $sym => $name"
            case "$name" in *closure*) ;; *) continue;; esac
            echo "::group::DISASM $name"
            otool -tV -p "$sym" "$bin" | sed -n 2,110p
            echo "::endgroup::"
          done
          run F1-full-debug '.'
          swift test -c release --no-parallel > /tmp/F2-full-release.log 2>&1; report F2-full-release $?
          echo "done"
      # Two groups of tests don't run here, so the CLI covers their ground on the real system:
      # one of the gate's tests, which macOS 15's Concurrency runtime kills (mars-dawn-kit#26), and the
      # wall-clock budgets, which a shared 3-CPU runner can't measure (mars-dawn-kit#15). These
      # exports drive the parsing worker, the nesting budget and the math extractor end to end.
      - name: Export documents through the CLI
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          printf '# Title\n\nInline $E=mc^2$ and a block:\n\n$$\n\\int_0^1 x\\,dx\n$$\n' > "$work/math.md"
          printf -- '---\ntitle: Front matter\n---\n\n# Body\n\nText.\n' > "$work/front.md"
          python3 -c "print('> ' * 250 + 'deep')" > "$work/deep.md"
          for config in debug release; do
            swift build -c $config --product marsdawn
            cli="$(swift build -c $config --show-bin-path)/marsdawn"
            for doc in math front deep; do
              MARSDAWN_APP_PATH=/nonexistent "$cli" export "$work/$doc.md" -o "$work/$doc-$config.pdf" --json
              head -c 5 "$work/$doc-$config.pdf" | grep -q '%PDF-'
            done
          done
          echo "CLI exports fine in debug and release"

  version-matches-tag:
    # `marsdawn --version` is how a script decides whether a feature exists, so a build that
    # reports the wrong number tells every caller something false. 0.4.0 shipped reporting 0.3.0:
    # the constant in Version.swift was never bumped, and nothing between the commit and the
    # user's `brew install` compared the two.
    #
    # The formula's `test do` does assert it, and the tap's CI runs `brew test`, so the guard
    # existed -- but it fires after the tag does, and a tag is immutable. By then the only repair
    # is a new patch version. This runs while the tag is the only thing that exists, before it has
    # been packaged, checksummed or pointed at by a formula.
    #
    # It builds and asks the binary rather than reading the constant out of the source, because
    # what a user gets is the binary's answer, and reading is what failed the first time.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Xcode 26
        run: |
          set -euo pipefail
          app=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Selecting $app"
          sudo xcode-select -s "$app"
      - name: The built CLI must report the tag it was built from
        # Through the environment, not interpolated into the script: a tag name is attacker-
        # supplied text as far as a workflow is concerned.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          swift build --product marsdawn
          cli="$(swift build --show-bin-path)/marsdawn"
          reported=$("$cli" --version)
          echo "tag: $TAG"
          echo "marsdawn --version: $reported"
          if [ "$reported" != "$TAG" ]; then
            echo "::error file=Sources/marsdawn/Version.swift::marsdawn --version reports '$reported' but this tag is '$TAG'. Bump MarsDawnCLI.version to match and cut a new patch tag -- tags are immutable, so this one cannot be moved."
            exit 1
          fi
          echo "The tag and the binary agree."

  ios:
    # The core library still supports iOS 17; make sure it keeps building for it.
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pick Xcode 26 here too, so this job doesn't drift if the runner's default changes.
      - name: Use Xcode 26
        run: |
          set -euo pipefail
          app=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Selecting $app"
          sudo xcode-select -s "$app"
      - run: xcodebuild -version
      - run: xcodebuild -scheme MarsDawnKit -destination 'generic/platform=iOS' build
