name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

# A newer push to the same branch supersedes an older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # macOS 15 is the package's floor; macOS 26 is what the app ships on.
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    # A nesting or table regression hangs rather than fails, so don't wait the 6-hour default.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # swift-tools 6.2 needs Xcode 26, which isn't the default on the macOS 15 image.
      - name: Use Xcode 26
        run: |
          set -euo pipefail
          app=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Selecting $app"
          sudo xcode-select -s "$app"
      - run: swift --version
      - run: swift build
      # Not in parallel: the hosted runners have 3 CPUs, and with every suite running at once the
      # WebKit suites time out waiting for their pages and the timing-budget tests miss their
      # budgets. Run alone they pass (checked on both runners in #22), and so does the whole
      # suite run serially.
      - run: swift test --no-parallel
      # Release builds inline more, so stack use per nesting level differs from debug.
      - run: swift test -c release --no-parallel

  ios:
    # The core library still supports iOS 17; make sure it keeps building for it.
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pick Xcode 26 here too, so this job doesn't drift if the runner's default changes.
      - name: Use Xcode 26
        run: |
          set -euo pipefail
          app=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Selecting $app"
          sudo xcode-select -s "$app"
      - run: xcodebuild -version
      - run: xcodebuild -scheme MarsDawnKit -destination 'generic/platform=iOS' build
