name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

# A newer push to the same branch supersedes an older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # macOS 15 is the package's floor; macOS 26 is what the app ships on.
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    # A nesting or table regression hangs rather than fails, so don't wait the 6-hour default.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # swift-tools 6.2 needs Xcode 26, which isn't the default on the macOS 15 image.
      - name: Use Xcode 26
        run: |
          set -euo pipefail
          app=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Selecting $app"
          sudo xcode-select -s "$app"
      - run: swift --version
      - run: swift build
      # TEMPORARY diagnostics for PR #22; removed before merge.
      - name: "Diagnostics: which String operation traps (plain program, no Swift Testing)"
        continue-on-error: true
        run: |
          cat > /tmp/ops.swift <<'SWIFT'
          import Foundation
          setvbuf(stdout, nil, _IONBF, 0)
          let lines = ["été: x", "\u{200D}a: x", "a\u{0600}: x", "a\u{0600}:x", "a:\u{0301} x", "a: \u{0301}v", "a: v \u{0301}", "\u{0301}a: x", "ab\u{200D}c: x"]
          for (n, line) in lines.enumerated() {
              let value: (line: String, key: String?, value: String?) = (line, nil, nil)
              print(n, "scalars", line.unicodeScalars.map { String($0.value, radix: 16) })
              print(n, "count", line.count)
              print(n, "==", line == String(line.reversed().reversed()))
              print(n, "hash", line.hashValue != 0 || true)
              print(n, "description", String(describing: line).count)
              print(n, "debugDescription", line.debugDescription)
              print(n, "reflecting tuple", String(reflecting: value))
              print(n, "json", String(decoding: try! JSONEncoder().encode(line), as: UTF8.self))
          }
          print("all done")
          SWIFT
          swiftc -Onone /tmp/ops.swift -o /tmp/ops && /tmp/ops; echo "Onone exit=$?"
          swiftc -O /tmp/ops.swift -o /tmp/ops-O && /tmp/ops-O; echo "O exit=$?"
      - name: "Diagnostics: CLI export on this runner, debug and release builds"
        continue-on-error: true
        run: |
          set -uo pipefail
          d=$(mktemp -d)
          printf -- '---\na\xd8\x80: x\na\xd8\x80:x\n\xe2\x80\x8da: x\na: \xcc\x81v\na: v \xcc\x81\n\xcc\x81a: x\n\xc3\xa9t\xc3\xa9: x\nab\xe2\x80\x8dc: x\n---\n# Body\n' > "$d/fm.md"
          python3 -c "print('> ' * 250 + 'deep')" > "$d/deep.md"
          for config in debug release; do
            swift build -c $config --product marsdawn
            for f in fm deep; do
              "$(swift build -c $config --show-bin-path)/marsdawn" export "$d/$f.md" -o "$d/$f-$config.pdf" --json; echo "$config $f exit=$?"
            done
          done
      - name: "Diagnostics: FrontMatterTests alone"
        continue-on-error: true
        run: |
          swift build --build-tests
          swift test --skip-build --no-parallel --filter 'FrontMatterTests' 2>&1 | grep -E 'keyValueRule|signal|Test run with|✘' | tail -60
      - name: "Diagnostics: crash reports so far"
        if: always()
        continue-on-error: true
        run: |
          sleep 20
          find ~/Library/Logs/DiagnosticReports /Library/Logs/DiagnosticReports -name '*.ips' -mmin -30 2>/dev/null | while read -r f; do echo "== $f"; head -c 12000 "$f"; echo; done
      # Release builds inline more, so stack use per nesting level differs from debug.
      - run: swift test -c release

  ios:
    # The core library still supports iOS 17; make sure it keeps building for it.
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pick Xcode 26 here too, so this job doesn't drift if the runner's default changes.
      - name: Use Xcode 26
        run: |
          set -euo pipefail
          app=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Selecting $app"
          sudo xcode-select -s "$app"
      - run: xcodebuild -version
      - run: xcodebuild -scheme MarsDawnKit -destination 'generic/platform=iOS' build
