name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

# A newer push to the same branch supersedes an older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # macOS 15 is the package's floor; macOS 26 is what the app ships on.
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    # A nesting or table regression hangs rather than fails, so don't wait the 6-hour default.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # swift-tools 6.2 needs Xcode 26, which isn't the default on the macOS 15 image.
      - name: Use Xcode 26
        run: |
          set -euo pipefail
          app=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Selecting $app"
          sudo xcode-select -s "$app"
      - run: swift --version
      - run: swift build
      # TEMPORARY diagnostics for PR #22; removed before merge.
      - name: "Diagnostics: run each suite alone to find the one that traps"
        continue-on-error: true
        run: |
          swift build --build-tests
          swift test list --skip-build 2>/dev/null | sed -E 's#/.*##' | sort -u > /tmp/suites
          wc -l < /tmp/suites
          while read -r suite; do
            swift test --skip-build --no-parallel --filter "^${suite//./\\.}/" > /tmp/out.txt 2>&1
            status=$?
            result=$(grep -E 'Test run with|signal code|Executed' /tmp/out.txt | tr '\n' ' ')
            echo "SUITE $suite exit=$status $result"
            if grep -q 'signal code' /tmp/out.txt; then grep -E '◇ Test|✔|✘' /tmp/out.txt | tail -25; fi
          done < /tmp/suites
      - name: "Diagnostics: crash reports so far"
        if: always()
        continue-on-error: true
        run: |
          sleep 20
          find ~/Library/Logs/DiagnosticReports /Library/Logs/DiagnosticReports -name '*.ips' -mmin -30 2>/dev/null | while read -r f; do echo "== $f"; head -c 12000 "$f"; echo; done
      # Release builds inline more, so stack use per nesting level differs from debug.
      - run: swift test -c release

  ios:
    # The core library still supports iOS 17; make sure it keeps building for it.
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pick Xcode 26 here too, so this job doesn't drift if the runner's default changes.
      - name: Use Xcode 26
        run: |
          set -euo pipefail
          app=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Selecting $app"
          sudo xcode-select -s "$app"
      - run: xcodebuild -version
      - run: xcodebuild -scheme MarsDawnKit -destination 'generic/platform=iOS' build
