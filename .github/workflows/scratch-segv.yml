name: scratch-segv
on:
  push:
    branches: [fix/238-release-segv]
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Xcode 26
        run: |
          set -euo pipefail
          app=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$app"
      - run: swift --version
      - run: git log -1 --format=%H
      - name: Release CLI probe
        run: |
          swift build -c release --product marsdawn
          cli="$(swift build -c release --show-bin-path)/marsdawn"
          printf '# t\n' > /tmp/some.md
          set +e
          MARSDAWN_APP_PATH=/nonexistent "$cli" open /tmp/some.md; echo "PROBE open exit=$?"
          MARSDAWN_APP_PATH=/nonexistent "$cli" open --json /tmp/some.md; echo "PROBE open-json exit=$?"
          exit 0
      - name: Build release tests
        run: MARSDAWN_APP_PATH=/nonexistent swift test -c release --no-parallel --filter 'ScratchSegvTests/s3_realEnterLeave' || true
      - name: Each scratch shape in its own process
        run: |
          set +e
          for t in s1_original s2_realDoCatch s3_realEnterLeave s4_realReadInside s5_realAsync s6_localOptSendable s7_localOptPlain s8_localNonOpt s9_localBoxed s10_realNoOverride s11_localOptSendableEnterLeave s12_realCapturing s13_realAsyncCapturing s14_realLetClosure s15_nonThrowing s16_intClosure s17_voidClosure s18_intClosureCapturing s19_realAsyncCapturingThenRequire; do
            MARSDAWN_APP_PATH=/nonexistent swift test -c release --skip-build --no-parallel --filter "ScratchSegvTests/$t" >/tmp/o.txt 2>&1
            rc=$?
            echo "PROBE $t exit=$rc $(grep -c 'signal code 11' /tmp/o.txt) segv"
          done
          exit 0
      - name: Release test, StandaloneToolTests
        run: |
          set +e
          MARSDAWN_APP_PATH=/nonexistent swift test -c release --skip-build --no-parallel --filter StandaloneToolTests
          echo "PROBE standalone-tests exit=$?"
          exit 0
